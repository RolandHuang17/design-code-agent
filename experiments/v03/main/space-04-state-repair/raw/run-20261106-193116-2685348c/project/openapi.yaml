openapi: 3.0.0
info:
  title: Space Fractions API
  description: >-
    API for the Space Fractions game. Documents the browser gateway
    (container port 3000) REST contract, including the original GET /play
    backwards-compatibility endpoint and the authenticated game,
    question and admin endpoints. Player responses never include correctAnswer.
  version: 1.0.0
servers:
  - url: "http://localhost:3000"
    description: Browser gateway (local/Compose)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness health check
      security: []
      responses:
        "200":
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /play:
    get:
      summary: Play the game (legacy backwards-compatible entrypoint)
      description: >-
        Original external API contract from Architecture_Documentation.md.
        Maps to game creation and returns the new gameId.
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                    description: Game ID
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/health:
    get:
      summary: API health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/games:
    get:
      summary: List the authenticated user's games (most recent first)
      description: >-
        Supports recovering a game after a full browser reload. Returns game
        state for the owner only; other users' games are never exposed.
      responses:
        "200":
          description: The user's games
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a new game
      description: >-
        Accepts an optional questionIds list for reproducible practice.
        Returns the new game with its questions (id, prompt, options) but
        never the correctAnswer.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                questionIds:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerQuestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/games/{id}:
    get:
      summary: Get game state
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Game state for the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/games/{id}/pause:
    post:
      summary: Pause an in-progress game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Game paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/games/{id}/resume:
    post:
      summary: Resume a paused game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Game resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/games/{id}/answers:
    post:
      summary: Submit an answer for a question in the game
      description: >-
        Each correct answer counts 1 point. Repeating an already-answered
        question does not increase the score (409 or idempotent 200).
        Answering while paused returns 409.
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questionId
                - answer
              properties:
                questionId:
                  type: string
                answer:
                  type: string
                  description: Fraction string, e.g. "3/4"
      responses:
        "200":
          description: Answer evaluated
          content:
            application/json:
              schema:
                type: object
                properties:
                  correct:
                    type: boolean
                  score:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/games/{id}/score:
    get:
      summary: Get the current score for a game
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Current score
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/questions:
    get:
      summary: List questions (admin only)
      responses:
        "200":
          description: List of questions including correctAnswer (admin only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminQuestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a question (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
                - options
                - correctAnswer
              properties:
                prompt:
                  type: string
                options:
                  type: array
                  items:
                    type: string
                correctAnswer:
                  type: string
                  description: A single valid fraction, e.g. "1/2"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/questions/{id}:
    put:
      summary: Update a question (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
                - options
                - correctAnswer
              properties:
                prompt:
                  type: string
                options:
                  type: array
                  items:
                    type: string
                correctAnswer:
                  type: string
                  description: A single valid fraction, e.g. "1/2"
      responses:
        "200":
          description: Question updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a question (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Question deleted
        "204":
          description: Question deleted (no content)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GameId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    PlayerQuestion:
      type: object
      properties:
        id:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            type: string

    Game:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum: [in-progress, paused, finished]
        score:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/PlayerQuestion"

    AdminQuestion:
      type: object
      properties:
        id:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string

  responses:
    BadRequest:
      description: Malformed input (e.g. invalid fraction)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Forbidden:
      description: Not authorized for this resource (non-owner or non-admin)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Conflict:
      description: State conflict (e.g. answer while paused, or duplicate answer)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string