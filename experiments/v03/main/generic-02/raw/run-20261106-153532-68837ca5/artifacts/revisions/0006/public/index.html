<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature converter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 30rem;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #1f2937;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-weight: 600;
    }
    input, select, button {
      font-size: 1rem;
      padding: 0.5rem;
    }
    .row {
      display: flex;
      gap: 1rem;
    }
    .row label {
      flex: 1;
    }
    #result {
      margin-top: 1rem;
      font-size: 1.25rem;
      font-weight: 700;
    }
    #error {
      margin-top: 0.5rem;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <h1>Temperature converter</h1>

  <form id="convert-form">
    <label>
      Temperature
      <input id="value" name="value" type="number" step="any" required>
    </label>
    <div class="row">
      <label>
        From
        <select id="from" name="from">
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </label>
      <label>
        To
        <select id="to" name="to">
          <option value="F">Fahrenheit (°F)</option>
          <option value="C">Celsius (°C)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </label>
    </div>
    <button type="submit">Convert</button>
  </form>

  <div id="result" aria-live="polite"></div>
  <div id="error" aria-live="assertive"></div>

  <script>
    const form = document.getElementById('convert-form');
    const valueInput = document.getElementById('value');
    const fromSelect = document.getElementById('from');
    const toSelect = document.getElementById('to');
    const resultEl = document.getElementById('result');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      resultEl.textContent = '';
      errorEl.textContent = '';

      const payload = {
        value: Number(valueInput.value),
        from: fromSelect.value,
        to: toSelect.value,
      };

      try {
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          let message = `Conversion failed (HTTP ${response.status})`;
          try {
            const body = await response.json();
            if (body && typeof body.error === 'string' && body.error) {
              message = body.error;
            }
          } catch (_) {
            // keep the default message
          }
          errorEl.textContent = message;
          return;
        }

        const body = await response.json();
        resultEl.textContent = `${body.value} ${body.unit}`;
      } catch (err) {
        errorEl.textContent = 'Network error: could not reach the server';
      }
    });
  </script>
</body>
</html>
