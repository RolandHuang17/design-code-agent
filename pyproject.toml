[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "design-code-agent"
version = "0.3.1"
description = "Traceable architecture-to-repository coding agent for Windows"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "certifi==2026.10.23"]

[project.scripts]
design-code-agent = "codeagent.cli:main"

[project.gui-scripts]
design-code-agent-gui = "codeagent.gui:main"
design-code-agent-superagent = "codeagent.superagent.gui:main"

[tool.setuptools.packages.find]
include = ["codeagent*"]

[tool.setuptools.package-data]
codeagent = ["acceptance/*.cjs", "cases/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["experiments", "examples", "runs", ".local", "build", "dist"]

