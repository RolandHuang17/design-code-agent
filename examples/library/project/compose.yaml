# Library borrowing application — local development stack.
#
# Two services:
#   gateway  — Node.js 22 / Express API + browser UI (container port 3000).
#   postgres — PostgreSQL 16 (container port 5432).
#
# No external volumes, host networking, privileged services or socket mounts.
# Bind mounts are relative and remain inside the project.

services:
  gateway:
    build:
      context: .
    container_name: library-gateway
    environment:
      PORT: "3000"
      # Browser-facing origin. Public host port is remapped by test runtimes,
      # so the gateway never assumes the host port equals the container port.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      # Identity-provider public URLs are read/forwarded only. Reader IDs are
      # caller-provided demonstration inputs, not authenticated identities.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:-}
      # PostgreSQL connection string honoring the postgres service DNS name.
      DATABASE_URL: postgresql://library:library@postgres:5432/library
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      # Managed Docker volume (declared below). This is NOT an external volume;
      # it keeps data inside Docker's storage and avoids host filesystem
      # ownership problems that break initdb on bind mounts (e.g. WSL/drvfs).
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data: