# Space Fractions – User Service
#
# Kubernetes Deployment + Service for the user profile service (port 3004).
# Resolves user profiles from OIDC claims and persists them to PostgreSQL.
# Reached by the gateway via its ClusterIP service DNS name
# (user-service.space-fractions.svc). Exposes Prometheus metrics on a
# second port (9094) for scraping.
#
# The service requires PostgreSQL (via Secret-backed DATABASE_URL) and OIDC
# issuer/audience configuration. Redis is best-effort; the service degrades
# gracefully when the cache is unavailable (see
# services/user-service/src/index.js). The database is required and the
# service fails fast if it cannot connect.
#
# Reference-only configuration: syntactically valid and aligned with the
# game-service-deployment.yaml conventions and compose.yaml project layout.
# It has NOT been validated against a live cluster.
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: space-fractions
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 3004
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9094
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: space-fractions
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: spacefractions/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
              protocol: TCP
            - name: metrics
              containerPort: 9094
              protocol: TCP
          env:
            - name: USER_SERVICE_PORT
              value: "3004"
            - name: USER_METRICS_PORT
              value: "9094"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: REDIS_URL
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_ISSUER
            - name: OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_AUDIENCE
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: OIDC_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false