# Space Fractions – Game Service
#
# Kubernetes Deployment + Service for the game logic service (port 3001).
# Owns game state: create game, get game, pause/resume, submit answer,
# score. Reached by the gateway via its ClusterIP service DNS name
# (game-service.space-fractions.svc). Exposes Prometheus metrics on a
# second port (9091) for scraping.
#
# The service requires PostgreSQL (via Secret-backed DATABASE_URL), Redis,
# RabbitMQ, and OIDC issuer/JWKS configuration. Failure to reach the broker
# is non-critical (see services/game-service/src/index.js); the database is
# the authoritative persistent state.
#
# Reference-only configuration: syntactically valid and aligned with the
# gateway-deployment.yaml conventions and compose.yaml project layout. It
# has NOT been validated against a live cluster.
apiVersion: v1
kind: Service
metadata:
  name: game-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/part-of: space-fractions
spec:
  type: ClusterIP
  selector:
    app: game-service
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/part-of: space-fractions
spec:
  replicas: 3
  selector:
    matchLabels:
      app: game-service
  template:
    metadata:
      labels:
        app: game-service
    spec:
      containers:
        - name: game-service
          image: spacefractions/game-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: GAME_SERVICE_PORT
              value: "3001"
            - name: GAME_METRICS_PORT
              value: "9091"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: RABBITMQ_URL
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_ISSUER
            - name: OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_AUDIENCE
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: OIDC_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false