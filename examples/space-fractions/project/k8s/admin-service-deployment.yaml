# Space Fractions – Admin Service
#
# Kubernetes Deployment + Service for the administrator question CRUD
# service (port 3004). Owns authenticated admin operations: create,
# update, list (with correct answers), and delete questions. Reached only
# by the gateway via its ClusterIP service DNS name
# (admin-service.space-fractions.svc); it is NOT exposed directly to
# browsers. Exposes Prometheus metrics on a second port (9094) for
# scraping.
#
# The service requires PostgreSQL (via Secret-backed DATABASE_URL), OIDC
# issuer/audience configuration, and Redis (best-effort). It also keeps
# the Elasticsearch question index in sync with admin CRUD (best-effort,
# non-fatal). See services/admin-service/src/index.js. PostgreSQL is
# authoritative persistent state and the service fails fast if it cannot
# connect; Redis and Elasticsearch degrade gracefully when unavailable.
#
# Reference-only configuration: syntactically valid and aligned with the
# game-service-deployment.yaml / question-service-deployment.yaml / user-
# service-deployment.yaml conventions and the compose.yaml project layout.
# It has NOT been validated against a live cluster.
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: admin-service
    app.kubernetes.io/part-of: space-fractions
spec:
  type: ClusterIP
  selector:
    app: admin-service
  ports:
    - name: http
      port: 3004
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9094
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: admin-service
    app.kubernetes.io/part-of: space-fractions
spec:
  replicas: 3
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: spacefractions/admin-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
              protocol: TCP
            - name: metrics
              containerPort: 9094
              protocol: TCP
          env:
            - name: ADMIN_SERVICE_PORT
              value: "3004"
            - name: ADMIN_METRICS_PORT
              value: "9094"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: REDIS_URL
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: ELASTICSEARCH_URL
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_ISSUER
            - name: OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_AUDIENCE
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: OIDC_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false