# Space Fractions – Question Service
#
# Kubernetes Deployment + Service for the question management service
# (port 3002). Owns the question catalog: retrieve questions, full-text
# search (Elasticsearch). Reached by the gateway via its ClusterIP service
# DNS name (question-service.space-fractions.svc). Exposes Prometheus
# metrics on a second port (9092) for scraping.
#
# The service requires PostgreSQL (via Secret-backed DATABASE_URL),
# Redis, Elasticsearch, and OIDC issuer/JWKS configuration. PostgreSQL is
# authoritative persistent state; Redis and Elasticsearch are best-effort
# and the service degrades gracefully when unavailable (see
# services/question-service/src/index.js).
#
# Reference-only configuration: syntactically valid and aligned with the
# gameservice/gateway deployment conventions and compose.yaml project
# layout. It has NOT been validated against a live cluster.
apiVersion: v1
kind: Service
metadata:
  name: question-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: question-service
    app.kubernetes.io/part-of: space-fractions
spec:
  type: ClusterIP
  selector:
    app: question-service
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9092
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: question-service
  namespace: space-fractions
  labels:
    app.kubernetes.io/name: question-service
    app.kubernetes.io/part-of: space-fractions
spec:
  replicas: 3
  selector:
    matchLabels:
      app: question-service
  template:
    metadata:
      labels:
        app: question-service
    spec:
      containers:
        - name: question-service
          image: spacefractions/question-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: QUESTION_SERVICE_PORT
              value: "3002"
            - name: QUESTION_METRICS_PORT
              value: "9092"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: REDIS_URL
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: ELASTICSEARCH_URL
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_ISSUER
            - name: OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: space-fractions-config
                  key: OIDC_AUDIENCE
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: space-fractions-secrets
                  key: OIDC_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false