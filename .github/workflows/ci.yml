name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name DesignCodeAgent --collect-data yaml --add-data "codeagent/acceptance/auth.cjs;codeagent/acceptance" desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: DesignCodeAgent-windows-x64
          path: dist/DesignCodeAgent.exe
          if-no-files-found: error
